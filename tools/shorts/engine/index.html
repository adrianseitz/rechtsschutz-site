<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Short</title>
<style>
  @font-face { font-family: "Geist"; src: url(../fonts/geist.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Serif"; src: url(../fonts/serif-italic.woff2) format("woff2"); font-style: italic; }
  @font-face { font-family: "Hand"; src: url(../fonts/caveat.woff2) format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Mono"; src: url(../fonts/mono.woff2) format("woff2"); font-weight: 100 900; }
  :root { --ink: #0B0B0A; --sun: #FFD60A; --paper: #F4F3EE; --red: #FF4F3F; --mint: #22C55E; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Geist, sans-serif; color: var(--ink); }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; box-sizing: border-box; }
  .cap { position: absolute; left: 80px; right: 120px; top: 230px; font-weight: 820; font-size: 92px; line-height: 0.98; letter-spacing: -0.045em; }
  .cap .w { display: inline-block; transform-origin: 50% 80%; margin-right: 0.22em; }
  .cap em { font-family: Serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; }
  .cap .mark { background: linear-gradient(transparent 58%, var(--sun) 58%, var(--sun) 92%, transparent 92%); padding: 0 0.06em; }
  .note { font-family: Hand; font-weight: 600; font-size: 50px; }
  .chip { position: absolute; padding: 22px 38px; border: 8px solid var(--ink); border-radius: 999px; background: #fff; font-weight: 800; font-size: 58px; letter-spacing: -0.03em; white-space: nowrap; }
  .fine { position: absolute; left: 80px; right: 160px; bottom: 300px; font-family: Geist; font-size: 26px; line-height: 1.35; color: rgba(11,11,10,.6); }
  svg { overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- „Boil“: Linien zittern leicht wie handgezeichnet -->
      <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="5" />
      </filter>
    </defs>
  </svg>
  <div id="layers"></div>
</div>

<script>
/* ======================================================================
   Mini-Engine: Jede Szene bekommt die Zeit t (Sekunden) und setzt Styles.
   render(t) ist deterministisch – so kann jedes Einzelbild exakt erzeugt werden.
   ====================================================================== */
const INK = "#0B0B0A", SUN = "#FFD60A", RED = "#FF4F3F", MINT = "#22C55E", PAPER = "#F4F3EE";
const $ = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = (x) => Math.pow(clamp(x), 3);
/* Feder mit Überschwinger für „Pop“-Effekte */
const spring = (x) => { x = clamp(x); return 1 - Math.cos(x * Math.PI * 2.4) * Math.exp(-5.2 * x); };
const win = (t, a, b) => clamp((t - a) / (b - a));
const layers = document.getElementById("layers");
const add = (html) => { const el = $(html); layers.appendChild(el); return el; };
const set = (el, { x = 0, y = 0, s = 1, sx, sy, r = 0, o = 1 }) => {
  el.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg) scale(${sx ?? s}, ${sy ?? s})`;
  el.style.opacity = o;
  el.style.visibility = o <= 0.001 ? "hidden" : "visible";
};
window.SFX = [];
const sfx = (time, kind, gain = 1) => window.SFX.push({ time, kind, gain });

/* ---------- Bildbausteine (eigene Figuren, flacher Cartoon-Stil) ---------- */
const STROKE = `stroke="${INK}" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"`;

function shieldMascot() {
  return `
  <svg class="abs" width="420" height="520" viewBox="-210 -230 420 520" filter="url(#boil)">
    <g class="legs">
      <path d="M-50 150 L-58 230" ${STROKE} fill="none"/><path d="M50 150 L58 230" ${STROKE} fill="none"/>
      <ellipse cx="-70" cy="236" rx="38" ry="18" fill="${INK}"/><ellipse cx="70" cy="236" rx="38" ry="18" fill="${INK}"/>
    </g>
    <g class="armL"><path d="M-118 10 Q-175 40 -180 95" ${STROKE} fill="none"/><circle cx="-180" cy="100" r="22" fill="#fff" ${STROKE}/></g>
    <g class="armR"><path d="M118 10 Q175 -20 190 -70" ${STROKE} fill="none"/><circle cx="192" cy="-78" r="22" fill="#fff" ${STROKE}/></g>
    <path d="M0 -170 C60 -140 110 -140 128 -140 L128 10 C128 95 60 145 0 172 C-60 145 -128 95 -128 10 L-128 -140 C-110 -140 -60 -140 0 -170Z" fill="${SUN}" ${STROKE}/>
    <path d="M-92 -112 L-92 0 C-92 50 -55 92 -18 112" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".55"/>
    <g class="face">
      <g class="eyes">
        <ellipse cx="-42" cy="-46" rx="26" ry="32" fill="#fff" ${STROKE}/><ellipse cx="42" cy="-46" rx="26" ry="32" fill="#fff" ${STROKE}/>
        <circle class="pupil" cx="-36" cy="-40" r="11" fill="${INK}"/><circle class="pupil" cx="48" cy="-40" r="11" fill="${INK}"/>
        <rect class="lid" x="-74" y="-82" width="150" height="0" fill="${SUN}"/>
      </g>
      <path class="brows" d="M-66 -96 Q-42 -110 -18 -98 M18 -98 Q42 -110 66 -96" ${STROKE} fill="none"/>
      <path class="mouth" d="M-40 22 Q0 62 40 22" ${STROKE} fill="#fff"/>
      <circle cx="-80" cy="12" r="15" fill="${RED}" opacity=".35"/><circle cx="80" cy="12" r="15" fill="${RED}" opacity=".35"/>
    </g>
  </svg>`;
}

function house() {
  return `
  <svg class="abs" width="560" height="560" viewBox="0 0 560 560" filter="url(#boil)">
    <rect x="60" y="230" width="440" height="300" rx="10" fill="#fff" ${STROKE}/>
    <path d="M30 250 L280 50 L530 250Z" fill="${INK}" ${STROKE}/>
    <rect x="390" y="90" width="56" height="100" fill="#fff" ${STROKE}/>
    <rect x="110" y="300" width="120" height="110" rx="6" fill="#DDEBFF" ${STROKE}/>
    <path d="M170 300 V410 M110 355 H230" ${STROKE}/>
    <rect x="320" y="300" width="120" height="110" rx="6" fill="#DDEBFF" ${STROKE}/>
    <path d="M380 300 V410 M320 355 H440" ${STROKE}/>
    <rect x="235" y="420" width="90" height="110" rx="6" fill="${SUN}" ${STROKE}/>
    <circle cx="305" cy="478" r="7" fill="${INK}"/>
  </svg>`;
}

function calendar(month) {
  return `
  <svg class="abs" width="300" height="330" viewBox="0 0 300 330" filter="url(#boil)">
    <rect x="10" y="30" width="280" height="290" rx="22" fill="#fff" ${STROKE}/>
    <path d="M10 52 Q10 30 32 30 H268 Q290 30 290 52 V100 H10Z" fill="${INK}"/>
    <path d="M80 10 V55 M220 10 V55" ${STROKE}/>
    <text x="150" y="82" text-anchor="middle" font-family="Geist" font-weight="800" font-size="40" fill="#fff">${month}</text>
    <g class="x" opacity="0"><path d="M95 150 L205 270 M205 150 L95 270" stroke="${RED}" stroke-width="26" stroke-linecap="round"/></g>
  </svg>`;
}

function coin() {
  return `<svg class="abs" width="120" height="120" viewBox="-60 -60 120 120" filter="url(#boil)"><circle r="48" fill="${SUN}" ${STROKE}/><text y="18" text-anchor="middle" font-family="Geist" font-weight="900" font-size="54" fill="${INK}">€</text></svg>`;
}

function wallet() {
  return `
  <svg class="abs" width="360" height="260" viewBox="0 0 360 260" filter="url(#boil)">
    <path d="M40 70 L250 20 L270 70" fill="#fff" ${STROKE}/>
    <rect x="20" y="70" width="320" height="170" rx="26" fill="${INK}"/>
    <rect x="230" y="125" width="110" height="60" rx="18" fill="${SUN}" ${STROKE}/>
    <circle cx="262" cy="155" r="10" fill="${INK}"/>
  </svg>`;
}

function hourglass() {
  return `
  <svg class="abs" width="260" height="380" viewBox="0 0 260 380" filter="url(#boil)">
    <rect x="20" y="10" width="220" height="34" rx="12" fill="${INK}"/><rect x="20" y="336" width="220" height="34" rx="12" fill="${INK}"/>
    <path d="M50 44 C50 140 120 160 120 190 C120 220 50 240 50 336 H210 C210 240 140 220 140 190 C140 160 210 140 210 44Z" fill="#fff" ${STROKE}/>
    <path class="sandTop" d="M70 70 H190 C190 120 140 150 130 175 C120 150 70 120 70 70Z" fill="${SUN}"/>
    <path class="sandBot" d="M70 330 H190 C185 300 150 280 130 270 C110 280 75 300 70 330Z" fill="${SUN}"/>
    <path class="stream" d="M130 178 V300" stroke="${SUN}" stroke-width="8"/>
  </svg>`;
}

/* ---------- Untertitel: Wörter poppen nacheinander auf ---------- */
function caption(lines, { top = 230, size = 92, color = INK } = {}) {
  const el = add(`<div class="cap" style="top:${top}px;font-size:${size}px;color:${color}"></div>`);
  const words = [];
  lines.forEach((line, li) => {
    line.split(" ").forEach((w) => {
      let cls = "w", txt = w;
      if (w.startsWith("*")) { cls += " em"; txt = w.slice(1); }
      if (w.startsWith("_")) { cls += " mark"; txt = w.slice(1); }
      const span = $(`<span class="${cls}">${cls.includes("em") ? `<em>${txt}</em>` : txt}</span>`);
      el.appendChild(span); words.push(span);
    });
    if (li < lines.length - 1) el.appendChild(document.createElement("br"));
  });
  return { el, words };
}
function showCaption(c, t, start, end, { stagger = 0.11, sound = true } = {}) {
  const visible = t >= start - 0.01 && t < end;
  c.el.style.visibility = visible ? "visible" : "hidden";
  const out = win(t, end - 0.25, end);
  c.words.forEach((w, i) => {
    const k = win(t, start + i * stagger, start + i * stagger + 0.32);
    const p = spring(k);
    w.style.opacity = k > 0 ? 1 - out : 0;
    w.style.transform = `translateY(${(1 - p) * 40 - out * 30}px) scale(${0.6 + 0.4 * p})`;
  });
}

/* ======================================================================
   Drehbuch: „Mieter zahlt nicht – was jetzt?“
   ====================================================================== */
const D = 26; // Gesamtdauer in Sekunden
window.DURATION = D;

// Szene 1 – Haken
const c1 = caption(["Dein Mieter", "zahlt *nicht", "*mehr."]);
const home = add(house());
const cals = ["März", "April", "Mai"].map((m) => add(calendar(m)));
// Szene 2 – Problem
const c2 = caption(["Jeder Monat", "kostet _dich."]);
const counter = add(`<div class="abs" style="font-weight:900;font-size:190px;letter-spacing:-0.06em;color:${RED};white-space:nowrap"></div>`);
const counterNote = add(`<div class="abs note" style="color:rgba(11,11,10,.65)">Beispiel: 950 € Kaltmiete, 6 Monate</div>`);
const purse = add(wallet());
const coins = Array.from({ length: 7 }, () => add(coin()));
const plus = add(`<div class="abs" style="font-weight:820;font-size:66px;letter-spacing:-0.035em">Dazu kommen:</div>`);
const chips = ["Anwalt", "Gericht", "Räumung"].map((w) => add(`<div class="chip">${w}</div>`));
// Szene 3 – Lösung
const c3 = caption(["Vermieter&shy;rechtsschutz", "zahlt _Anwalt, _Gericht", "& _Räumung.*"], { size: 80 });
const mascot = add(shieldMascot());
const card = add(`<div class="abs" style="width:880px;padding:44px 50px;border:9px solid ${INK};border-radius:44px;background:${SUN};box-shadow:14px 14px 0 ${INK}">
  <div style="font-weight:850;font-size:70px;letter-spacing:-0.04em;line-height:1">+ Mietausfall&shy;schutz</div>
  <div style="margin-top:18px;font-size:46px;font-weight:600;line-height:1.2">ersetzt die Miete samt Nebenkosten – bis zu 12 Monate.*</div>
</div>`);
// Szene 4 – Achtung Wartezeit
const c4 = caption(["Aber: Erst", "absichern,", "*dann Ärger."]);
const glass = add(hourglass());
const waitNote = add(`<div class="abs note" style="font-size:64px;white-space:nowrap">meist 3 Monate Wartezeit</div>`);
// Szene 5 – Handlungsaufforderung
const c5 = caption(["Passt das zu", "deiner *Immobilie?"]);
const cta = add(`<div class="abs" style="width:900px;padding:56px 56px 50px;border-radius:52px;background:${INK};color:#fff">
  <div style="font-weight:850;font-size:84px;letter-spacing:-0.045em;line-height:1">Kostenloser Check</div>
  <div style="margin-top:14px;font-size:50px;color:rgba(255,255,255,.75)">in 60 Sekunden – persönliche Beratung, kein Callcenter</div>
  <div style="margin-top:40px;display:inline-flex;align-items:center;gap:20px;background:${SUN};color:${INK};border-radius:999px;padding:22px 40px;font-weight:800;font-size:56px">Link in der Bio <span style="font-size:60px">↑</span></div>
</div>`);
const brand = add(`<div class="abs" style="display:flex;align-items:center;gap:22px;white-space:nowrap">
  <svg width="86" height="86" viewBox="0 0 86 86"><rect width="86" height="86" rx="22" fill="${INK}"/><path d="M43 16 C55 22 64 22 68 22 V44 C68 58 56 67 43 72 C30 67 18 58 18 44 V22 C22 22 31 22 43 16Z" fill="${SUN}"/><path d="M32 44 L40 52 L55 35" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span style="font-weight:800;font-size:58px;letter-spacing:-0.04em">Seitz <em style="font-family:Serif;font-weight:400">Rechtsschutz</em></span>
</div>`);
const fine = add(`<div class="fine">* je nach Tarif. Mietausfallschutz als Zusatzbaustein in ausgewählten Tarifen; Leerstand und bestehende Rückstände sind nicht versichert. Adrian Seitz, gebundener Versicherungsvertreter (§ 34d Abs. 7 GewO), Vertriebspartner der ARAG.</div>`);

/* Szenengrenzen */
const S = { s1: [0, 4.2], s2: [4.2, 10.2], s3: [10.2, 17.2], s4: [17.2, 21.4], s5: [21.4, D] };

// Geräusche (werden beim Rendern zu einer Tonspur gemischt)
sfx(0.05, "whoosh");
[1.3, 2.1, 2.9].forEach((t) => sfx(t, "stamp"));
for (let i = 0; i < 6; i++) sfx(5.2 + i * 0.42, "coin", 0.7);
[8.3, 8.6, 8.9].forEach((t) => sfx(t, "pop"));
sfx(10.3, "boing"); sfx(13.6, "ching"); sfx(17.3, "whoosh"); sfx(21.5, "whoosh"); sfx(22.8, "pop"); sfx(23.8, "boing", 0.7);

function render(t) {
  // Boil: Linien wechseln alle 3 Bilder leicht ihre Form
  document.getElementById("turb").setAttribute("seed", String(1 + Math.floor(t * 10) % 5));
  const inS = (s) => t >= S[s][0] && t < S[s][1];

  /* ---- Szene 1 ---- */
  showCaption(c1, t, 0.1, S.s1[1]);
  {
    const a = ease(win(t, 0, 0.5)), out = easeIn(win(t, S.s1[1] - 0.35, S.s1[1]));
    set(home, { x: 260, y: 1120 + (1 - a) * 400 + out * 600, o: inS("s1") ? 1 : 0, s: 1 + Math.sin(t * 2) * 0.01 });
    cals.forEach((c, i) => {
      const t0 = 0.9 + i * 0.8;
      const k = win(t, t0, t0 + 0.35);
      const p = spring(k);
      set(c, { x: 90 + i * 300, y: 820 + (1 - p) * -220 + out * 600, r: (i - 1) * 6, s: 0.7 + 0.3 * p, o: inS("s1") && k > 0 ? 1 : 0 });
      const x = c.querySelector(".x"); const sk = win(t, t0 + 0.4, t0 + 0.55);
      x.setAttribute("opacity", sk > 0 ? 1 : 0); x.style.transformOrigin = "150px 210px"; x.style.transform = `scale(${1.6 - 0.6 * ease(sk)})`;
    });
  }

  /* ---- Szene 2 ---- */
  showCaption(c2, t, S.s2[0] + 0.05, S.s2[1]);
  {
    const on = inS("s2");
    const months = Math.min(6, Math.floor(clamp((t - 5.2) / 0.42 + 1, 0, 6)));
    const shown = t < 5.2 ? 0 : months;
    counter.textContent = `– ${(shown * 950).toLocaleString("de-DE")} €`;
    const shake = t > 5.2 && t < 7.8 ? Math.sin(t * 60) * 4 : 0;
    const out = easeIn(win(t, S.s2[1] - 0.3, S.s2[1]));
    set(counter, { x: 80 + shake, y: 560 - out * 200, o: on && t > 5.0 ? 1 - out : 0 });
    set(counterNote, { x: 88, y: 790, o: on && t > 5.6 ? 1 - out : 0 });
    // Geldbörse unten: Münzen fliegen heraus
    const pk = spring(win(t, 4.6, 5.1));
    set(purse, { x: 360, y: 1330 + (1 - pk) * 300 + out * 500, r: Math.sin(t * 20) * (t > 5.2 && t < 7.8 ? 2 : 0), o: on ? 1 : 0 });
    coins.forEach((c, i) => {
      const t0 = 5.2 + i * 0.42, k = win(t, t0, t0 + 1.0);
      const dir = i % 2 ? 1 : -1;
      set(c, { x: 480 + dir * k * (220 + i * 30), y: 1330 - k * 520 + k * k * 380, r: k * 360 * dir, s: 1 - k * 0.2, o: on && k > 0 && k < 1 ? 1 : 0 });
    });
    set(plus, { x: 80, y: 920, o: on && t > 8.0 ? 1 - out : 0 });
    chips.forEach((c, i) => {
      const k = win(t, 8.3 + i * 0.3, 8.65 + i * 0.3), p = spring(k);
      set(c, { x: [80, 440, 210][i], y: [1030, 1050, 1180][i] + (1 - p) * -60, r: [-4, 3, -2][i], s: 0.5 + 0.5 * p, o: on && k > 0 ? 1 - out : 0 });
    });
  }

  /* ---- Szene 3 ---- */
  showCaption(c3, t, S.s3[0] + 0.25, S.s3[1], { stagger: 0.12 });
  {
    const on = inS("s3") || inS("s4");
    const k = win(t, S.s3[0], S.s3[0] + 0.6);
    const jump = Math.abs(Math.sin(win(t, S.s3[0], S.s3[0] + 1.2) * Math.PI * 2)) * (1 - win(t, S.s3[0], S.s3[0] + 1.2)) * 80;
    const squash = 1 + Math.sin(t * 7) * 0.025;
    let mx = 330, my = 1000;
    if (inS("s4")) { mx = 600; my = 1080; }
    const slide = inS("s4") ? ease(win(t, S.s4[0], S.s4[0] + 0.5)) : 0;
    const out = easeIn(win(t, S.s4[1] - 0.3, S.s4[1]));
    set(mascot, { x: lerp(330, mx, slide), y: my - jump + (1 - ease(k)) * 900 + out * 900, sx: 1 / squash, sy: squash, o: on ? 1 : 0 });
    // Winken, dann Zeigen
    const armR = mascot.querySelector(".armR");
    const wave = inS("s3") ? Math.sin(t * 9) * 18 * (1 - win(t, S.s3[0] + 2.5, S.s3[0] + 3)) : -38;
    armR.style.transformOrigin = "118px 10px"; armR.style.transform = `rotate(${wave}deg)`;
    // Blinzeln
    const lid = mascot.querySelector(".lid"); const bl = (t % 3.1) < 0.12 ? 64 : 0; lid.setAttribute("height", bl);
    const pupils = mascot.querySelectorAll(".pupil");
    pupils.forEach((p) => p.setAttribute("transform", inS("s4") ? "translate(-10 -4)" : "translate(0 0)"));
    const mouth = mascot.querySelector(".mouth");
    mouth.setAttribute("d", inS("s4") ? "M-30 34 Q0 22 30 34" : "M-40 22 Q0 62 40 22");
    const brows = mascot.querySelector(".brows");
    brows.setAttribute("d", inS("s4") ? "M-66 -104 Q-42 -96 -18 -90 M18 -90 Q42 -96 66 -104" : "M-66 -96 Q-42 -110 -18 -98 M18 -98 Q42 -110 66 -96");

    const ck = win(t, 13.5, 13.95), cp = spring(ck);
    const cout = easeIn(win(t, S.s3[1] - 0.3, S.s3[1]));
    set(card, { x: 80, y: 1490 - 380 + (1 - cp) * 120 - 0, r: -2 + (1 - cp) * 6, s: 0.8 + 0.2 * cp, o: inS("s3") && ck > 0 ? 1 - cout : 0 });
    if (inS("s3") && t > 13.5) set(mascot, { x: 330, y: 760 - jump, sx: 0.8 / squash, sy: 0.8 * squash, o: 1 });
  }

  /* ---- Szene 4 ---- */
  showCaption(c4, t, S.s4[0] + 0.1, S.s4[1]);
  {
    const on = inS("s4"), k = spring(win(t, S.s4[0] + 0.5, S.s4[0] + 1.0));
    const out = easeIn(win(t, S.s4[1] - 0.3, S.s4[1]));
    set(glass, { x: 150, y: 960 + out * 600, r: Math.sin(t * 3) * 3, s: 0.6 + 0.4 * k, o: on ? 1 : 0 });
    const f = win(t, S.s4[0] + 0.6, S.s4[1]);
    glass.querySelector(".sandTop").setAttribute("transform", `translate(0 ${f * 60}) scale(1 ${1 - f * 0.6})`);
    glass.querySelector(".sandBot").setAttribute("transform", `translate(130 330) scale(1 ${0.4 + f * 0.8}) translate(-130 -330)`);
    set(waitNote, { x: 90, y: 760, r: -3, o: on && t > S.s4[0] + 1.2 ? 1 - out : 0 });
  }

  /* ---- Szene 5 ---- */
  showCaption(c5, t, S.s5[0] + 0.1, D + 1);
  {
    const on = inS("s5") || t >= D;
    const k = spring(win(t, S.s5[0] + 1.4, S.s5[0] + 1.9));
    const bob = Math.sin(t * 3.2) * 6;
    set(cta, { x: 80, y: 660 + (1 - k) * 160 + bob, s: 0.85 + 0.15 * k, r: -1.5, o: on && t > S.s5[0] + 1.4 ? 1 : 0 });
    {
      const mk = spring(win(t, S.s5[0] + 2.4, S.s5[0] + 3.0));
      if (on && t > S.s5[0] + 2.4) {
        set(mascot, { x: 640, y: 1040 + (1 - mk) * 500, s: 0.55, o: 1 });
        const armR = mascot.querySelector(".armR"); armR.style.transformOrigin = "118px 10px"; armR.style.transform = `rotate(${-30 + Math.sin(t * 8) * 10}deg)`;
        mascot.querySelector(".mouth").setAttribute("d", "M-40 22 Q0 62 40 22");
        mascot.querySelector(".brows").setAttribute("d", "M-66 -96 Q-42 -110 -18 -98 M18 -98 Q42 -110 66 -96");
        mascot.querySelectorAll(".pupil").forEach((p) => p.setAttribute("transform", "translate(4 -10)"));
      }
    }
    set(brand, { x: 90, y: 1250, o: on && t > S.s5[0] + 2.2 ? ease(win(t, S.s5[0] + 2.2, S.s5[0] + 2.6)) : 0 });
  }
  set(fine, { o: t > S.s3[0] + 3 && t < S.s3[1] ? 0.9 : t >= S.s5[0] + 2.2 ? 0.9 : 0 });
}

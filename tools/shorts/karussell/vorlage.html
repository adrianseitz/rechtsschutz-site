<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Vorlage für die Bilder-Posts (Instagram-Karussell, 1080 × 1350). render.mjs ruft window.zeige(post, nr) auf. -->
<style>
@font-face { font-family: "Geist"; src: url("../fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Serif"; src: url("../fonts/serif-italic.woff2") format("woff2"); font-style: italic; }
:root { --ink: #0B0B0A; --paper: #F4F3EE; --sun: #FFD60A; --sun-soft: #FFF1A8; --muted: #71716B; --line: #E2E1DA; --red: #D93A2B; --green: #1F8A4C; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body { font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#s { position: relative; width: 1080px; height: 1350px; padding: 72px 84px 64px; display: flex; flex-direction: column; overflow: hidden; }
#s.dark { background: var(--ink); color: #fff; }
#s.light { background: var(--paper); color: var(--ink); }
#s.sun { background: var(--sun); color: var(--ink); }

/* Kopf und Fuß */
.top { display: flex; align-items: center; justify-content: space-between; height: 56px; position: relative; z-index: 2; }
.brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 650; letter-spacing: -0.03em; }
.brand i { font-family: "Serif"; font-weight: 400; font-size: 34px; letter-spacing: 0; }
.pg { font-size: 24px; font-weight: 600; padding: 10px 20px; border-radius: 99px; border: 2px solid currentColor; opacity: .55; font-variant-numeric: tabular-nums; }
.main { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2; }
.in { display: flex; flex-direction: column; }
.ln { display: block; white-space: nowrap; }
.big { white-space: nowrap; }
.foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; min-height: 44px; position: relative; z-index: 2; font-size: 22px; line-height: 1.35; }
.foot .fine { opacity: .62; max-width: 760px; }
.foot .url { font-weight: 600; opacity: .62; white-space: nowrap; }
.swipe { display: inline-flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 650; white-space: nowrap; }
.swipe b { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--sun); color: var(--ink); }
.sun .swipe b { background: var(--ink); color: var(--sun); }

/* Schrift */
.tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 650; padding: 14px 26px; border-radius: 99px; background: var(--sun); color: var(--ink); margin-bottom: 48px; }
.dark .tag { background: var(--sun); }
.light .tag, .sun .tag { background: var(--ink); color: #fff; }
.kicker { font-size: 38px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 28px; opacity: .7; }
h1 { font-size: 128px; line-height: .97; font-weight: 780; letter-spacing: -0.05em; }
h2 { font-size: 92px; line-height: 1; font-weight: 760; letter-spacing: -0.045em; }
h3 { font-size: 64px; line-height: 1.05; font-weight: 720; letter-spacing: -0.035em; }
.txt { font-size: 40px; line-height: 1.32; letter-spacing: -0.015em; margin-top: 40px; max-width: 860px; }
.dark .txt { color: rgba(255,255,255,.78); }
.light .txt, .sun .txt { color: rgba(11,11,10,.74); }
em { font-family: "Serif"; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
mark { background: none; color: inherit; }
.dark mark { color: var(--sun); }
.light mark { background: linear-gradient(transparent 58%, var(--sun) 58%, var(--sun) 92%, transparent 92%); padding: 0 .06em; }
.sun mark { font-family: "Serif"; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
sup { font-size: .5em; vertical-align: .75em; margin-left: .04em; font-weight: 600; }

/* Deko */
.deko { position: absolute; z-index: 1; pointer-events: none; }

/* Titelseite */
.t-cover h1 { font-size: 150px; }
.t-cover .sub { font-size: 44px; line-height: 1.28; margin-top: 52px; max-width: 820px; letter-spacing: -0.02em; }
.dark .sub { color: rgba(255,255,255,.75); }

/* Chat */
.phone { margin-top: 56px; background: #fff; color: var(--ink); border-radius: 48px; padding: 36px 40px 44px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.45); }
.phone .who { display: flex; align-items: center; gap: 22px; padding-bottom: 28px; border-bottom: 2px solid var(--line); margin-bottom: 32px; }
.phone .av { width: 76px; height: 76px; border-radius: 50%; background: #D9D8D1; display: grid; place-items: center; font-weight: 700; font-size: 30px; color: #6b6a64; }
.phone .nm { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; }
.phone .st { font-size: 24px; color: var(--muted); margin-top: 4px; }
.bub { font-size: 38px; line-height: 1.3; background: #EDECE6; padding: 26px 32px; border-radius: 34px 34px 34px 10px; margin-top: 18px; max-width: 800px; letter-spacing: -0.01em; }
.bub small { display: block; font-size: 22px; color: var(--muted); margin-top: 8px; text-align: right; }

/* Brief */
.brief { position: relative; margin: 52px 10px 0; background: #fff; color: var(--ink); padding: 56px 60px 60px; transform: rotate(-1.6deg); box-shadow: 0 40px 80px -30px rgba(0,0,0,.4), 0 2px 0 rgba(0,0,0,.04); border-radius: 6px; }
.brief .abs { font-size: 22px; color: var(--muted); line-height: 1.4; }
.brief .bt { font-size: 40px; font-weight: 720; margin: 36px 0 26px; letter-spacing: -0.02em; }
.brief p { font-size: 32px; line-height: 1.42; margin-top: 14px; color: #33332f; }
.stempel { position: absolute; right: 40px; top: 44px; transform: rotate(9deg); border: 6px solid var(--red); color: var(--red); font-weight: 800; font-size: 40px; padding: 10px 22px; border-radius: 12px; letter-spacing: .02em; }

/* große Zahl */
.big { font-size: 236px; line-height: .9; font-weight: 800; letter-spacing: -0.065em; margin-left: -8px; }
.big.minus { color: var(--red); }
.dark .big.minus { color: #FF6B5E; }
.note { font-size: 32px; margin-top: 30px; opacity: .65; }
.chips-t { font-size: 34px; font-weight: 650; margin-top: 76px; }
.chips { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 24px; }
.chip { font-size: 38px; font-weight: 650; padding: 18px 32px; border-radius: 99px; letter-spacing: -0.02em; }
.light .chip { background: #fff; border: 2px solid var(--line); }
.dark .chip { background: rgba(255,255,255,.1); }
.sun .chip { background: rgba(255,255,255,.55); }
.chip::before { content: "+ "; color: var(--red); }

/* Liste */
.rows { margin-top: 64px; display: flex; flex-direction: column; gap: 22px; }
.row { display: flex; align-items: center; gap: 30px; font-size: 48px; font-weight: 650; letter-spacing: -0.025em; padding: 30px 36px; border-radius: 30px; }
.light .row { background: #fff; border: 2px solid var(--line); }
.dark .row { background: rgba(255,255,255,.08); }
.sun .row { background: rgba(255,255,255,.5); }
.ic { flex: 0 0 auto; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 750; }
.ic.check { background: var(--ink); color: var(--sun); }
.dark .ic.check { background: var(--sun); color: var(--ink); }
.ic.cross { background: #FCE4E1; color: var(--red); }
.ic.num { background: var(--sun); color: var(--ink); }
.sun .ic.num { background: var(--ink); color: var(--sun); }

/* Vergleich */
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 60px; }
.col { border-radius: 36px; padding: 40px 36px 44px; display: flex; flex-direction: column; }
.col.a { background: #fff; border: 2px solid var(--line); }
.col.b { background: var(--sun); }
.col .lb { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; padding-bottom: 26px; border-bottom: 2px solid rgba(0,0,0,.1); }
.col .r { display: flex; align-items: center; gap: 18px; font-size: 36px; font-weight: 600; margin-top: 26px; letter-spacing: -0.02em; }
.col .r .ic { width: 52px; height: 52px; font-size: 26px; }
.col .tot { margin-top: auto; padding-top: 44px; font-size: 52px; font-weight: 780; letter-spacing: -0.04em; line-height: 1.02; }
.col.a .tot { color: var(--red); }
.col .tl { font-size: 26px; font-weight: 600; opacity: .6; margin-top: 10px; letter-spacing: 0; }

/* Lösung */
.produkt { font-size: 124px; line-height: .95; font-weight: 800; letter-spacing: -0.055em; }
.unter { font-size: 40px; font-weight: 650; margin-top: 52px; letter-spacing: -0.02em; }
.hl { margin-top: 44px; background: var(--ink); color: #fff; border-radius: 34px; padding: 38px 44px; font-size: 40px; line-height: 1.28; font-weight: 600; letter-spacing: -0.02em; }
.hl b { color: var(--sun); font-weight: 700; }

/* Achtung */
.warn { width: 150px; height: 150px; margin-bottom: 48px; }
.box { margin-top: 64px; display: flex; align-items: center; gap: 36px; background: var(--ink); color: #fff; border-radius: 36px; padding: 36px 44px; }
.dark .box { background: rgba(255,255,255,.08); }
.box .n { font-size: 96px; font-weight: 800; letter-spacing: -0.05em; color: var(--sun); line-height: 1; white-space: nowrap; }
.box .t { font-size: 34px; line-height: 1.3; font-weight: 550; color: rgba(255,255,255,.85); }

/* Mythos / Fakt */
.myth { margin-top: 52px; display: flex; flex-direction: column; gap: 24px; }
.mc { border-radius: 36px; padding: 38px 44px 42px; }
.mc .ml { display: inline-flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 750; text-transform: uppercase; letter-spacing: .08em; }
.mc .ml .ic { width: 50px; height: 50px; font-size: 24px; }
.mc p { font-size: 42px; line-height: 1.26; font-weight: 640; letter-spacing: -0.02em; margin-top: 18px; }
.mc.m { background: #fff; border: 2px solid var(--line); color: var(--ink); }
.mc.m p { color: #5a5a54; text-decoration: line-through; text-decoration-color: rgba(217,58,43,.75); text-decoration-thickness: 3px; }
.mc.f { background: var(--ink); color: #fff; }
.mc.f .ml { color: var(--sun); }
.mc.f .ic.check { background: var(--sun); color: var(--ink); }
.dark .mc.f { background: rgba(255,255,255,.1); }

/* Abschluss */
.t-cta h1 { font-size: 132px; }
.knopf { align-self: flex-start; display: inline-flex; align-items: center; gap: 22px; margin-top: 64px; background: var(--sun); color: var(--ink); font-size: 44px; font-weight: 720; letter-spacing: -0.025em; padding: 30px 46px; border-radius: 99px; }
.knopf b { display: grid; place-items: center; width: 60px; height: 60px; border-radius: 50%; background: var(--ink); color: var(--sun); }
.person { display: flex; align-items: center; gap: 28px; margin-top: 72px; }
.person img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--sun); }
.person .pn { font-size: 38px; font-weight: 700; letter-spacing: -0.02em; }
.person .pt { font-size: 28px; opacity: .7; margin-top: 6px; }
.t-cta .foot .fine { font-size: 20px; max-width: none; }
</style>
</head>
<body>
<div id="s"></div>
<script>
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
// [betont] = Akzent, {kursiv} = Serifen-Kursiv, * = Fußnote „je nach Tarif“
const fmt = (t) => esc(t).replace(/\[([^\]]+)\]/g, "<mark>$1</mark>").replace(/\{([^}]+)\}/g, "<em>$1</em>").replace(/\*/g, "<sup>*</sup>");
const lines = (a) => (Array.isArray(a) ? a : [a]).map((l) => `<span class="ln">${fmt(l)}</span>`).join("");
const arrow = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const logo = (dark) => `<svg width="56" height="56" viewBox="0 0 34 34"><rect width="34" height="34" rx="11" fill="${dark ? "#FFD60A" : "#0B0B0A"}"/><path d="M17 7.5 9.5 10.4v6.1c0 4.6 3.1 8.5 7.5 10 4.4-1.5 7.5-5.4 7.5-10v-6.1L17 7.5Z" fill="${dark ? "#0B0B0A" : "#FFD60A"}"/><path d="m13.6 17.2 2.4 2.4 4.6-4.8" fill="none" stroke="${dark ? "#FFD60A" : "#0B0B0A"}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const shield = (c, o) => `<svg width="900" height="1000" viewBox="0 0 34 34"><path d="M17 3 6 7.2v8.9c0 6.7 4.5 12.4 11 14.6 6.5-2.2 11-7.9 11-14.6V7.2L17 3Z" fill="none" stroke="${c}" stroke-opacity="${o}" stroke-width=".7"/></svg>`;
const warnIcon = '<svg class="warn" viewBox="0 0 24 24"><path d="M12 2.6 1.6 20.6h20.8L12 2.6Z" fill="#FFD60A" stroke="#0B0B0A" stroke-width="1.3" stroke-linejoin="round"/><path d="M12 9v5.2" stroke="#0B0B0A" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.2" fill="#0B0B0A"/></svg>';
const mark = (m, i) => (m === "cross" ? '<span class="ic cross">✕</span>' : m === "num" ? `<span class="ic num">${i + 1}</span>` : '<span class="ic check">✓</span>');

// Standard-Hintergrund je Folientyp (überschreibbar mit "theme")
const THEME = { mythos: "light", cover: "dark", chat: "light", brief: "light", zahl: "light", text: "light", liste: "light", vergleich: "light", loesung: "sun", achtung: "light", cta: "dark" };

const BAU = {
  cover: (s) => `${s.tag ? `<span class="tag">${esc(s.tag)}</span>` : ""}<h1>${lines(s.title)}</h1>${s.sub ? `<p class="sub">${fmt(s.sub)}</p>` : ""}`,
  chat: (s) => `${s.title ? `<h3>${lines(s.title)}</h3>` : ""}<div class="phone"><div class="who"><div class="av">${esc((s.sender || "M")[0])}</div><div><div class="nm">${esc(s.sender || "Mieter")}</div><div class="st">${esc(s.status || "online")}</div></div></div>${(s.messages || []).map((m) => `<div class="bub">${fmt(m)}<small>${esc(s.time || "08:14")}</small></div>`).join("")}</div>`,
  brief: (s) => `${s.title ? `<h3>${lines(s.title)}</h3>` : ""}<div class="brief">${s.stamp ? `<div class="stempel">${esc(s.stamp)}</div>` : ""}<div class="abs">${(s.from || []).map(esc).join("<br>")}</div><div class="bt">${fmt(s.subject || "")}</div>${(s.body || []).map((p) => `<p>${fmt(p)}</p>`).join("")}</div>`,
  zahl: (s) => `${s.kicker ? `<p class="kicker">${fmt(s.kicker)}</p>` : ""}<div class="big ${s.minus ? "minus" : ""}">${fmt(s.big)}</div>${s.note ? `<p class="note">${fmt(s.note)}</p>` : ""}${s.itemsTitle ? `<p class="chips-t">${fmt(s.itemsTitle)}</p>` : ""}${s.items ? `<div class="chips">${s.items.map((x) => `<span class="chip">${fmt(x)}</span>`).join("")}</div>` : ""}`,
  text: (s) => `${s.kicker ? `<p class="kicker">${fmt(s.kicker)}</p>` : ""}<h2>${lines(s.title)}</h2>${s.text ? `<p class="txt">${fmt(s.text)}</p>` : ""}`,
  liste: (s) => `${s.kicker ? `<p class="kicker">${fmt(s.kicker)}</p>` : ""}<h2>${lines(s.title)}</h2><div class="rows">${s.items.map((x, i) => `<div class="row">${mark(s.mark, i)}<span>${fmt(x)}</span></div>`).join("")}</div>${s.text ? `<p class="txt">${fmt(s.text)}</p>` : ""}`,
  vergleich: (s) => {
    const col = (c, cls, m) => `<div class="col ${cls}"><div class="lb">${fmt(c.label)}</div>${c.rows.map((r) => `<div class="r">${mark(m)}<span>${fmt(r)}</span></div>`).join("")}<div class="tot">${fmt(c.total)}${c.totalLabel ? `<div class="tl">${fmt(c.totalLabel)}</div>` : ""}</div></div>`;
    return `${s.kicker ? `<p class="kicker">${fmt(s.kicker)}</p>` : ""}<h3>${lines(s.title)}</h3><div class="vs">${col(s.left, "a", "cross")}${col(s.right, "b", "check")}</div>`;
  },
  loesung: (s) => `${s.kicker ? `<p class="kicker">${fmt(s.kicker)}</p>` : ""}<div class="produkt">${lines(s.product)}</div>${s.itemsTitle ? `<p class="unter">${fmt(s.itemsTitle)}</p>` : ""}${s.items ? `<div class="rows" style="margin-top:28px">${s.items.map((x) => `<div class="row">${mark("check")}<span>${fmt(x)}</span></div>`).join("")}</div>` : ""}${s.highlight ? `<div class="hl">${fmt(s.highlight).replace(/&lt;b&gt;(.*?)&lt;\/b&gt;/g, "<b>$1</b>")}</div>` : ""}`,
  mythos: (s) => `${s.title ? `<h3>${lines(s.title)}</h3>` : ""}<div class="myth"><div class="mc m"><span class="ml">${mark("cross")}Mythos</span><p>${fmt(s.myth)}</p></div><div class="mc f"><span class="ml">${mark("check")}Fakt</span><p>${fmt(s.fact)}</p></div></div>`,
  achtung: (s) => `${s.icon !== false ? warnIcon : ""}${s.kicker ? `<p class="kicker">${fmt(s.kicker)}</p>` : ""}<h2>${lines(s.title)}</h2>${s.text ? `<p class="txt">${fmt(s.text)}</p>` : ""}${s.box ? `<div class="box"><div class="n">${fmt(s.box.big)}</div><div class="t">${fmt(s.box.text)}</div></div>` : ""}`,
  cta: (s) => `${s.kicker ? `<p class="kicker">${fmt(s.kicker)}</p>` : ""}<h1>${lines(s.title)}</h1><span class="knopf">${fmt(s.button || "Kostenlos beraten lassen")}<b>${arrow}</b></span><div class="person"><img src="adrian.jpg" alt=""><div><div class="pn">Adrian Seitz</div><div class="pt">${fmt(s.person || "ARAG-Vertriebspartner · Link in der Bio")}</div></div></div>`,
};

window.zeige = (post, nr) => {
  const s = post.slides[nr], n = post.slides.length, last = nr === n - 1;
  const theme = s.theme || THEME[s.type] || "light";
  const el = document.getElementById("s");
  el.className = `${theme} t-${s.type}`;
  const dark = theme === "dark";
  const hatStern = JSON.stringify(s).includes("*");
  const fine = last ? fmt(post.fine).replace(/<sup>\*<\/sup>/g, "*") : hatStern ? fmt(s.fine || post.footnote || "* je nach Tarif").replace(/<sup>\*<\/sup>/g, "*") : "";
  const deko = s.type === "cover" ? `<div class="deko" style="right:-330px;bottom:-140px">${shield("#FFD60A", .22)}</div>`
    : s.type === "cta" ? `<div class="deko" style="right:-420px;top:-160px">${shield("#FFD60A", .14)}</div>` : "";
  el.innerHTML = `${deko}
    <div class="top"><div class="brand">${logo(dark)}<span>Seitz<i> Rechtsschutz</i></span></div><span class="pg">${nr + 1}/${n}</span></div>
    <div class="main"><div class="in">${BAU[s.type](s)}</div></div>
    <div class="foot"><span class="fine">${fine}</span>${last ? "" : nr === 0 ? `<span class="swipe">Wischen<b>${arrow}</b></span>` : `<span class="url">seitz-rechtsschutz.de</span>`}</div>`;
  return document.fonts.ready.then(() => {
    // Überschriften behalten die Zeilen aus dem Text: zu breite Zeilen werden kleiner statt umzubrechen
    for (const h of el.querySelectorAll("h1, h2, h3, .big, .produkt")) {
      const max = h.clientWidth;
      let fs = parseFloat(getComputedStyle(h).fontSize);
      const widest = () => Math.max(h.scrollWidth, ...[...h.querySelectorAll(".ln")].map((l) => l.scrollWidth));
      while (widest() > max + 1 && fs > 40) { fs -= 2; h.style.fontSize = fs + "px"; }
    }
    // Zu lange Texte: Hauptbereich schrittweise verkleinern, bis alles passt
    const main = el.querySelector(".main"), inner = main.firstElementChild;
    const zuGross = () => inner.getBoundingClientRect().height > main.clientHeight + 2;
    let z = 1;
    while (zuGross() && z > 0.62) { z -= 0.03; inner.style.zoom = z; }
    return { overflow: zuGross(), zoom: Math.round(z * 100) / 100 };
  });
};
</script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>3D-Short</title>
<style>
  @font-face { font-family: "Geist"; src: url(../fonts/geist.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Serif"; src: url(../fonts/serif-italic.woff2) format("woff2"); font-style: italic; }
  @font-face { font-family: "Hand"; src: url(../fonts/caveat.woff2) format("woff2"); font-weight: 400 700; }
  :root { --ink: #0B0B0A; --sun: #FFD60A; --paper: #F4F3EE; --red: #F0442F; --mint: #16A34A; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Geist, sans-serif; color: var(--ink); }
  .bg { position: absolute; inset: 0; }
  .bgL { background: linear-gradient(180deg, #FBFAF6 0%, #F4F3EE 60%, #EBE8DC 100%); }
  .bgD { background: radial-gradient(1000px 1000px at 58% 1240px, #2A271C 0%, rgba(42,39,28,0) 70%), linear-gradient(180deg, #0B0B0A 0%, #100F0C 100%); }
  #sun { position: absolute; left: 0; top: 0; width: 840px; height: 840px; margin: -420px 0 0 -420px; border-radius: 50%; background: radial-gradient(circle at 34% 26%, #FFE873 0%, #FFD60A 50%, #F0C200 100%); box-shadow: 0 50px 140px -20px rgba(255,200,0,.45); will-change: transform; }
  #vig { background: radial-gradient(1500px 1500px at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,.13) 100%); }
  #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #ui { position: absolute; inset: 0; --fg: #0B0B0A; --bgc: #fff; }
  .beat { position: absolute; inset: 0; color: var(--fg); }
  .beat.dark { --fg: #fff; --bgc: #0B0B0A; --red: #FF5A45; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; box-sizing: border-box; }
  .cap { position: absolute; left: 80px; top: 250px; width: 920px; font-weight: 840; line-height: 0.98; letter-spacing: -0.05em; }
  .cap .ln { white-space: nowrap; overflow: hidden; padding: 0.04em 0 0.13em 0; margin-bottom: -0.13em; }
  .cap .w { display: inline-block; margin-right: 0.21em; }
  .cap .w:last-child { margin-right: 0; }
  .cap .em { font-family: Serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; }
  .cap .mark { background: linear-gradient(transparent 58%, var(--sun) 58%, var(--sun) 92%, transparent 92%); padding: 0 0.06em; }
  .beat.dark .cap .mark { color: var(--sun); background: none; padding: 0; }
  .note { font-family: Hand; font-weight: 600; font-size: 54px; white-space: nowrap; color: color-mix(in srgb, var(--fg) 74%, transparent); }
  .soft { background: #fff; color: #0B0B0A; border: 1px solid rgba(11,11,10,.06); border-radius: 36px; box-shadow: 0 2px 4px rgba(11,11,10,.05), 0 30px 60px -24px rgba(11,11,10,.34); }
  .chip { position: absolute; padding: 18px 36px 20px; border-radius: 999px; background: var(--fg); color: var(--bgc); font-weight: 760; font-size: 50px; letter-spacing: -0.03em; white-space: nowrap; box-shadow: 0 22px 40px -18px rgba(0,0,0,.5); }
  .row { position: absolute; left: 0; top: 0; width: 920px; min-height: 120px; display: flex; align-items: center; gap: 28px; padding: 20px 32px; box-sizing: border-box; font-weight: 740; font-size: 52px; letter-spacing: -0.03em; line-height: 1.06; }
  .badge { flex: none; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 850; font-size: 42px; }
  .sticker { position: absolute; padding: 26px 50px 32px; border-radius: 36px; background: var(--sun); color: #0B0B0A; box-shadow: 0 2px 4px rgba(11,11,10,.05), 0 34px 60px -24px rgba(160,120,0,.6); font-weight: 900; letter-spacing: -0.055em; white-space: nowrap; line-height: 1; }
  .card { width: 920px; padding: 42px 48px; border-radius: 40px; background: var(--sun); color: #0B0B0A; box-shadow: 0 2px 4px rgba(11,11,10,.05), 0 34px 60px -24px rgba(160,120,0,.6); }
  .fine { position: absolute; left: 60px; width: 960px; box-sizing: border-box; top: 1610px; padding: 18px 26px 20px; border-radius: 24px; font-size: 23px; line-height: 1.35; background: rgba(255,255,255,.93); color: rgba(11,11,10,.78); box-shadow: 0 20px 50px -20px rgba(0,0,0,.45); }
</style>
</head>
<body>
<div id="stage">
  <div class="bg" id="bgA"></div><div class="bg" id="bgS" style="background:#FFD60A"></div><div class="bg" id="bgB"></div><div id="sun"></div>
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div class="bg" id="vig"></div>
  <div id="ui"><div id="beats"></div><div id="overlay"></div></div>
</div>
<script src="../vendor/three.iife.js"></script>
<script src="../shared/talk.js"></script>
<script src="avatar.js"></script>
<script>
/* ======================================================================
   3D-Studio-Vorlage. Unten steht der Moderator als 3D-Figur (three.js, siehe avatar.js) vor einer gelben Scheibe,
   daneben schweben 3D-Objekte zum Thema. Darüber liegt die Typografie (wie auf der Website).
   Ein Abschnitt (beat) = eine Szene; Typen: hook, cost, fact, list, solution, warning, cta.
   Problem-Szenen (cost, warning) spielen im dunklen Studio, alles andere im hellen.
   render(t) ist deterministisch – jedes Einzelbild lässt sich exakt erzeugen.
   ====================================================================== */
const EP = window.EP, TM = window.EP_TIMING, T = THREE;
const INK = "#0B0B0A", SUN = "#FFD60A", RED = "#F0442F", MINT = "#16A34A";
const DARK = { cost: 1, warning: 1 };
const $ = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = (x) => Math.pow(clamp(x), 3);
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const spring = (x) => { x = clamp(x); return 1 - Math.cos(x * Math.PI * 2.2) * Math.exp(-5.6 * x); };
const win = (t, a, b) => clamp((t - a) / (b - a));
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const set = (el, { x = 0, y = 0, s = 1, r = 0, o = 1, tilt = 0 }) => { el.style.transform = `translate(${x}px, ${y}px) perspective(1500px) rotateX(${tilt}deg) rotate(${r}deg) scale(${s})`; el.style.opacity = o; el.style.visibility = o <= 0.001 ? "hidden" : "visible"; };
window.SFX = [];


function parse(s) {
  const out = []; let cur = "", mode = null;
  for (const ch of String(s)) {
    if (ch === "[" || ch === "{") { if (cur) out.push({ t: cur, m: mode }); cur = ""; mode = ch === "[" ? "em" : "hl"; continue; }
    if (ch === "]" || ch === "}") { if (cur) out.push({ t: cur, m: mode }); cur = ""; mode = null; continue; }
    cur += ch;
  }
  if (cur) out.push({ t: cur, m: mode });
  return out;
}
const plain = (s) => parse(s).map((p) => p.t).join("");
const rich = (s) => parse(s).map((p) => p.m === "em" ? `<em style="font-family:Serif;font-weight:400">${esc(p.t)}</em>` : p.m === "hl" ? `<span style="background:${SUN};padding:0 .1em;border-radius:.12em">${esc(p.t)}</span>` : esc(p.t)).join("");

/* ====================== 3D-Bühne ====================== */
const renderer = new T.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: false, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);
renderer.toneMapping = T.NeutralToneMapping; renderer.toneMappingExposure = 1.08;
const scene = new T.Scene();
// Spiegelungen der Studio-Umgebung: nur auf den Hochglanz-Teilen (Männchen, Münzen, Plaketten) – auf allem wäre es ohne Grafikkarte viel zu langsam
const ENV = new T.PMREMGenerator(renderer).fromScene(new T.RoomEnvironment(), 0.03).texture, SHINY = [];
const cam = new T.PerspectiveCamera(27, 1080 / 1920, 0.1, 100);
const key = new T.DirectionalLight(0xfff4e0, 2.3); key.position.set(-4, 5, 9);
const hemi = new T.HemisphereLight(0xffffff, 0xd9cdb8, 1.25);
const rim = new T.DirectionalLight(0xffe9a8, 1.6); rim.position.set(5, 5, -7);
const fill = new T.DirectionalLight(0xdfe9ff, 0.6); fill.position.set(7, 1, 5);
scene.add(key, hemi, rim, fill);
const PPU = 253, PIVOT_Y = -960 / PPU;   // Bildpunkte je Einheit; Drehpunkt der Bühne = unterer Bildrand
const ST = new T.Group(); scene.add(ST);   // Moderator und Objekte; wird als Ganzes verschoben und skaliert
// Kantenglättung als Nachbearbeitung (FXAA): die eingebaute Glättung (MSAA) kostet ohne Grafikkarte die doppelte Rechenzeit
const RT = new T.WebGLRenderTarget(1080, 1920, { type: T.HalfFloatType });
const POST = new T.Mesh(new T.PlaneGeometry(2, 2), new T.ShaderMaterial({
  uniforms: { tDiffuse: { value: RT.texture }, px: { value: new T.Vector2(1 / 1080, 1 / 1920) } }, depthTest: false, depthWrite: false,
  vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 px; varying vec2 vUv;
    float lum(vec4 c) { vec3 m = c.rgb / (1.0 + c.rgb); return dot(m, vec3(0.299, 0.587, 0.114)) * 0.6 + c.a * 0.4; }
    void main() {
      vec4 cM = texture2D(tDiffuse, vUv);
      float lNW = lum(texture2D(tDiffuse, vUv + vec2(-1.0, -1.0) * px)), lNE = lum(texture2D(tDiffuse, vUv + vec2(1.0, -1.0) * px));
      float lSW = lum(texture2D(tDiffuse, vUv + vec2(-1.0, 1.0) * px)), lSE = lum(texture2D(tDiffuse, vUv + vec2(1.0, 1.0) * px)), lM = lum(cM);
      float lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE))), lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));
      vec4 c = cM;
      if (lMax - lMin > 0.03) {
        vec2 dir = vec2(-((lNW + lNE) - (lSW + lSE)), (lNW + lSW) - (lNE + lSE));
        float red = max((lNW + lNE + lSW + lSE) * 0.03125, 0.0078125), rcp = 1.0 / (min(abs(dir.x), abs(dir.y)) + red);
        dir = clamp(dir * rcp, vec2(-8.0), vec2(8.0)) * px;
        vec4 a = 0.5 * (texture2D(tDiffuse, vUv + dir * (1.0 / 3.0 - 0.5)) + texture2D(tDiffuse, vUv + dir * (2.0 / 3.0 - 0.5)));
        vec4 b = a * 0.5 + 0.25 * (texture2D(tDiffuse, vUv - dir * 0.5) + texture2D(tDiffuse, vUv + dir * 0.5));
        float lB = lum(b); c = (lB < lMin || lB > lMax) ? a : b;
      }
      gl_FragColor = vec4(c.a > 0.0 ? c.rgb / c.a : vec3(0.0), c.a);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      gl_FragColor.rgb *= gl_FragColor.a;
    }`,
})), POST_CAM = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1); POST.frustumCulled = false;

const mat = (color, o = {}) => new T.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0, ...o });
const gloss = (color, o = {}) => new T.MeshStandardMaterial({ color, roughness: 0.34, metalness: 0, ...o });
const shiny = (color, o = {}) => { const m = new T.MeshPhysicalMaterial({ color, roughness: 0.24, envMap: ENV, ...o }); SHINY.push(m); return m; };
const M = { ink: gloss(0x141412), white: gloss(0xffffff, { roughness: 0.4 }), glove: shiny(0xffffff, { roughness: 0.35 }), sun: gloss(0xffd60a), red: gloss(0xf0442f), blue: gloss(0x8fb8ff), sky: gloss(0xcfe2ff, { roughness: 0.15 }), mint: shiny(0x1fc45c),
  wood: gloss(0xc98a4b), woodDark: gloss(0x8a5a2b), paper: mat(0xfdfcf8, { roughness: 0.65 }), grey: mat(0xc9cdd6), skin: mat(0xf2c9a5), green: gloss(0x6fcf8c),
  gold: shiny(0xffc21a, { roughness: 0.22, metalness: 0.75 }), goldDark: shiny(0xe9a400, { roughness: 0.3, metalness: 0.75 }) };
const mesh = (geo, m, x = 0, y = 0, z = 0) => { const o = new T.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; return o; };
const box = (w, h, d, m, x = 0, y = 0, z = 0, r = 0.08) => mesh(new T.RoundedBoxGeometry(w, h, d, 5, Math.min(r, w / 2.01, h / 2.01, d / 2.01)), m, x, y, z);
const cyl = (r, h, m, x = 0, y = 0, z = 0, seg = 48) => mesh(new T.CylinderGeometry(r, r, h, seg), m, x, y, z);
const ball = (r, m, x = 0, y = 0, z = 0) => mesh(new T.SphereGeometry(r, 40, 28), m, x, y, z);
const group = (...kids) => { const g = new T.Group(); if (kids.length) g.add(...kids); return g; };
// runde Scheibe mit weicher Kante (Podest, Münzen, Plaketten); Oberkante bei y = 0
function disc(r, h, bevel, m) {
  const pts = [new T.Vector2(0, -h)], N = 8;
  for (let i = 0; i <= N; i++) { const a = (i / N) * Math.PI / 2; pts.push(new T.Vector2(r - bevel + Math.sin(a) * bevel, -h + bevel - Math.cos(a) * bevel)); }
  for (let i = 0; i <= N; i++) { const a = (i / N) * Math.PI / 2; pts.push(new T.Vector2(r - bevel + Math.cos(a) * bevel, -bevel + Math.sin(a) * bevel)); }
  pts.push(new T.Vector2(0, 0));
  return mesh(new T.LatheGeometry(pts, 96), m);
}
// weicher Kontaktschatten direkt unter einem Objekt
const blobTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d"), g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, "rgba(40,28,0,.55)"); g.addColorStop(0.55, "rgba(40,28,0,.2)"); g.addColorStop(1, "rgba(40,28,0,0)"); x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new T.CanvasTexture(c); })();
function blob(r) { const m = new T.Mesh(new T.PlaneGeometry(2, 2), new T.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.y = 0.006; m.scale.setScalar(r); return m; }

/* ---------- Objekte (Fuß bei y = 0, ca. 2 Einheiten hoch) ---------- */
const COIN = T.mergeGeometries([disc(0.3, 0.09, 0.03, null).geometry, disc(0.2, 0.02, 0.008, null).geometry.translate(0, 0.008, 0)]);
const PROPS = {
  house() {
    const roofShape = new T.Shape(); roofShape.moveTo(-1.28, 0); roofShape.lineTo(0, 0.98); roofShape.lineTo(1.28, 0); roofShape.closePath();
    const roof = mesh(new T.ExtrudeGeometry(roofShape, { depth: 1.72, bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.07, bevelSegments: 6 }), M.red, 0, 1.3, -0.86);
    const win = (x) => group(box(0.5, 0.5, 0.08, M.ink, x, 0.84, 0.76, 0.06), box(0.38, 0.38, 0.1, M.sky, x, 0.84, 0.78, 0.04));
    return group(box(2.0, 1.4, 1.5, M.white, 0, 0.7, 0, 0.12), roof, box(0.3, 0.62, 0.3, M.white, 0.64, 2.0, -0.2, 0.06), box(0.5, 0.84, 0.1, M.sun, 0, 0.42, 0.76, 0.07), ball(0.05, M.ink, 0.15, 0.44, 0.83), win(-0.64), win(0.64));
  },
  building() {
    const g = group(box(1.5, 2.5, 1.2, M.blue, 0, 1.25, 0, 0.12), box(1.64, 0.16, 1.34, M.ink, 0, 2.52, 0, 0.06), box(0.42, 0.52, 0.08, M.ink, 0, 0.26, 0.61, 0.05));
    for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) g.add(box(0.28, 0.28, 0.08, (r + c) % 3 === 0 ? M.sun : M.white, -0.44 + c * 0.44, 0.86 + r * 0.42, 0.61, 0.05));
    return g;
  },
  money() {
    const g = group(), coin = () => new T.Group().add(mesh(COIN, M.gold));
    [0, 1, 2].forEach((i) => { const n = box(1.5, 0.1, 0.82, M.green, -0.3, 0.06 + i * 0.11, -0.25, 0.04); n.rotation.y = (i - 1) * 0.16; g.add(n); if (i === 2) { const b = cyl(0.2, 0.02, M.white, 0, 0.06, 0); n.add(b); } });
    for (let i = 0; i < 8; i++) { const c = coin(); c.position.set(0.55 + Math.sin(i * 2.1) * 0.02, 0.09 + i * 0.092, 0.4 + Math.cos(i * 1.7) * 0.02); c.name = "coin" + (7 - i); c.userData.home = c.position.clone(); g.add(c); }
    [[-0.25, 0.62, 3], [0.98, -0.1, 2]].forEach(([x, z, n]) => { for (let i = 0; i < n; i++) { const c = coin(); c.position.set(x, 0.09 + i * 0.092, z); g.add(c); } });
    return g;
  },
  calendar() {
    const g = group(box(1.8, 1.8, 0.3, M.white, 0, 1.0, 0, 0.14), box(1.8, 0.52, 0.32, M.red, 0, 1.66, 0, 0.14));
    [-0.5, 0.5].forEach((x) => g.add(cyl(0.06, 0.4, M.ink, x, 1.95, 0.02)));
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) g.add(box(0.26, 0.22, 0.06, r === 1 && c === 2 ? M.sun : M.grey, -0.54 + c * 0.36, 1.2 - r * 0.32, 0.16, 0.05));
    g.rotation.x = -0.12; return g;
  },
  paperSheet(extra) {
    const g = group(box(1.45, 1.95, 0.09, M.paper, 0, 1.05, 0, 0.04));
    [0, 1, 2, 3].forEach((i) => g.add(box(i % 2 ? 0.75 : 1.0, 0.07, 0.03, M.grey, i % 2 ? -0.13 : 0, 1.7 - i * 0.26, 0.05, 0.02)));
    extra(g); g.rotation.set(-0.16, 0, -0.06); return g;
  },
  contract() {
    return PROPS.paperSheet((g) => {
      const sig = new T.CatmullRomCurve3([[-0.45, 0.45], [-0.3, 0.62], [-0.18, 0.42], [-0.02, 0.6], [0.12, 0.44], [0.32, 0.56]].map(([x, y]) => new T.Vector3(x, y, 0.06)));
      g.add(mesh(new T.TubeGeometry(sig, 40, 0.024, 8), mat(0x2563eb)));
      const pen = group(cyl(0.06, 1.1, M.ink, 0, 0, 0, 16), mesh(new T.ConeGeometry(0.06, 0.18, 16), M.sun, 0, -0.64, 0)); pen.children[1].rotation.x = Math.PI; pen.position.set(0.62, 0.78, 0.38); pen.rotation.set(0.5, 0, -0.5); g.add(pen);
    });
  },
  bill() { return PROPS.paperSheet((g) => { const b = disc(0.32, 0.08, 0.03, M.red); b.rotation.x = Math.PI / 2; b.position.set(0.3, 0.52, 0.13); g.add(b, box(0.26, 0.06, 0.03, M.white, 0.3, 0.52, 0.14, 0.02)); }); },
  letter() {
    const flap = new T.Shape(); flap.moveTo(-1.0, 0); flap.lineTo(0, -0.72); flap.lineTo(1.0, 0); flap.closePath();
    const f = mesh(new T.ExtrudeGeometry(flap, { depth: 0.03, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 3 }), mat(0xece8dd), 0, 1.68, 0.1);
    const seal = disc(0.22, 0.08, 0.03, M.red); seal.rotation.x = Math.PI / 2; seal.position.set(0, 1.0, 0.2);
    const g = group(box(2.1, 1.35, 0.2, M.white, 0, 1.0, 0, 0.1), f, seal); g.rotation.set(-0.15, 0, 0.07); return g;
  },
  gavel() {
    const head = group(cyl(0.34, 1.15, M.wood, 0, 0, 0), cyl(0.37, 0.14, M.gold, 0, 0.42, 0), cyl(0.37, 0.14, M.gold, 0, -0.42, 0)); head.rotation.z = Math.PI / 2;
    const ham = bake(group(head, cyl(0.075, 1.55, M.wood, 0, -0.85, 0, 20))); ham.position.set(-0.25, 1.75, 0); ham.rotation.z = -0.75; ham.name = "hammer";
    const base = disc(0.74, 0.22, 0.05, M.woodDark); base.position.set(0.45, 0.22, 0); const top = disc(0.6, 0.1, 0.04, M.wood); top.position.set(0.45, 0.3, 0);
    return group(base, top, ham);
  },
  person() {
    const body = mesh(new T.CapsuleGeometry(0.55, 0.7, 8, 24), gloss(0x3b82f6), 0, 0.9, 0);
    const hair = mesh(new T.SphereGeometry(0.49, 32, 20, 0, Math.PI * 2, 0, Math.PI * 0.46), M.ink, 0, 2.08, -0.03); hair.rotation.x = -0.35;
    const smile = mesh(new T.TorusGeometry(0.13, 0.026, 10, 24, Math.PI), M.ink, 0, 1.96, 0.42); smile.rotation.z = Math.PI;
    const tie = box(0.14, 0.5, 0.06, M.sun, 0, 1.2, 0.54, 0.03);
    return group(body, ball(0.46, M.skin, 0, 2.05, 0), hair, smile, ball(0.05, M.ink, -0.16, 2.1, 0.42), ball(0.05, M.ink, 0.16, 2.1, 0.42), box(0.44, 0.12, 0.06, M.white, 0, 1.5, 0.5, 0.03), tie);
  },
  clock() {
    const g = group(); const face = disc(0.95, 0.3, 0.06, M.white); face.rotation.x = Math.PI / 2; face.position.set(0, 1.15, 0.15); g.add(face);
    g.add(mesh(new T.TorusGeometry(0.97, 0.1, 20, 80), M.sun, 0, 1.15, 0.02));

    if (bt.note) { const n = $(`<div class="abs soft" style="padding:22px 36px;border-radius:28px;font-weight:720;font-size:48px;letter-spacing:-0.025em;white-space:nowrap">${esc(plain(bt.note))}</div>`); A.push(popActor(root, n, 80, 250 + cap.height + 50, { r: -1.5, from: 40, n: 0.4 })); }
    A.splice(1, 0, propActor(bt.icon || "clock", { sfx: "whoosh" }));
    return A;
  },
  cta(bt, root) {
    const A = [], cap = capActor(root, bt.question, { size: 112 }); A.push(cap);
    const box = bt.box || "Kostenloser Check", sub = bt.sub || "in 60 Sekunden – ohne Callcenter";
    const card = $(`<div class="abs" style="width:920px;padding:50px 54px 50px;border-radius:48px;background:${INK};color:#fff;box-shadow:0 40px 70px -30px rgba(11,11,10,.7)">
      <div style="font-weight:850;font-size:84px;letter-spacing:-0.045em;line-height:1">${esc(plain(box))}</div>
      <div style="margin-top:14px;font-size:44px;color:rgba(255,255,255,.76);white-space:nowrap">${esc(plain(sub))}</div>
      <div class="btn" style="margin-top:36px;display:inline-flex;align-items:center;gap:18px;background:${SUN};color:${INK};border-radius:999px;padding:22px 44px;font-weight:800;font-size:56px;letter-spacing:-0.03em">Link in der Bio <span>↑</span></div></div>`);
    const C = popActor(root, card, 80, 250 + cap.height + 60, { r: -1, from: 120, n: 0.6, sfx: "pop" }); A.push(C);
    const up = C.update, btn = card.querySelector(".btn");
    C.update = (lt) => { up(lt); btn.style.transform = `scale(${1 + Math.max(0, Math.sin((lt - C.a - 0.9) * 4.2)) * 0.035})`; };
    return A;
  },
};

/* ---------- Aufbau ---------- */
const beatsRoot = document.getElementById("beats"), overlayRoot = document.getElementById("overlay"), PLANS = [];
let OVER = null, BAR = null;
function schedule(items, w0, w1) {
  const live = items.filter((it) => !it.free), gap = 0.1;
  const nat = live.reduce((s, it) => s + it.n, 0) + gap * Math.max(0, live.length - 1), k = Math.min(1.3, (w1 - w0) / Math.max(nat, 0.01));
  let t = w0; for (const it of live) { it.a = t; it.b = t + it.n * k; t = it.b + gap * k; }
}
function build() {
  EP.beats.forEach((bt, i) => {
    const root = $(`<div class="beat${DARK[bt.type] ? " dark" : ""}"></div>`); beatsRoot.appendChild(root);
    const D = TM.beats[i].dur, A = (BEATS[bt.type] || BEATS.fact)(bt, root);
    schedule(A, 0.08, D - (bt.type === "cta" ? 1.4 : 0.55));
    if (A.after) A.after();
    // Platz für die Bühne: so groß, wie unter dem Text frei bleibt
    A.forEach((a) => !a.prop && a.update(999));
    let bottom = 0; for (const el of root.children) { const r = el.getBoundingClientRect(); if (r.width > 0) bottom = Math.max(bottom, r.bottom); }
    const hasProp = A.some((a) => a.prop);
    PLANS.push({ root, A, D, start: TM.beats[i].start, dark: DARK[bt.type] ? 1 : 0, hasProp, propAt: hasProp ? A.find((a) => a.prop).a : 0, zoom: clamp((1920 - bottom - 30) / 1085, 0.7, 1), hostX: hasProp || bt.type === "cta" ? 0.44 : 0 });
    if (i > 0) SFX.push({ time: TM.beats[i].start, kind: "whoosh", gain: 0.7 });
    A.forEach((a) => { if (a.sfx) SFX.push({ time: TM.beats[i].start + a.a, kind: a.sfx, gain: a.sfx === "coin" ? 0.7 : 0.9 }); });
    if (A.cheerAt != null) { SFX.push({ time: TM.beats[i].start + A.cheerAt, kind: "boing", gain: 0.6 }); CONFETTI.times.push(TM.beats[i].start + A.cheerAt); }
  });
  BAR = $(`<div class="abs" style="left:80px;top:206px;width:920px;height:8px;display:flex;gap:10px"></div>`);
  TM.beats.forEach((b) => BAR.appendChild($(`<div style="flex:${b.dur} 1 0;background:color-mix(in srgb, var(--fg) 14%, transparent);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:0;background:var(--fg);border-radius:4px"></i></div>`)));
  const brand = $(`<div class="abs" style="white-space:nowrap;color:var(--fg)">
    <svg width="92" height="92" viewBox="0 0 86 86" style="display:block;filter:drop-shadow(0 16px 20px rgba(160,120,0,.4))"><path d="M43 6 C58 14 70 14 76 14 V44 C76 62 60 74 43 81 C26 74 10 62 10 44 V14 C16 14 28 14 43 6Z" fill="${SUN}"/><path d="M29 43 L39 53 L58 32" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="margin-top:20px;font-weight:840;font-size:62px;letter-spacing:-0.05em;line-height:.95">Seitz</div>
    <div style="font-family:Serif;font-style:italic;font-size:62px;letter-spacing:-0.02em;line-height:1">Rechtsschutz</div></div>`);
  const fine = $(`<div class="fine">${esc(EP.fine || "* je nach Tarif und Versicherungsbedingungen; Wartezeiten und Ausschlüsse beachten. Adrian Seitz, gebundener Versicherungsvertreter (§ 34d Abs. 7 GewO), Vertriebspartner der ARAG.")}</div>`);
  overlayRoot.append(BAR, brand, fine);
  const sol = EP.beats.findIndex((b) => b.type === "solution" && JSON.stringify(b).includes("*")), cta = EP.beats.findIndex((b) => b.type === "cta");
  OVER = { brand, fine, sol: sol >= 0 ? TM.beats[sol] : null, cta: cta >= 0 ? TM.beats[cta] : null };
}

const ui = document.getElementById("ui"), bgA = document.getElementById("bgA"), bgB = document.getElementById("bgB"), bgS = document.getElementById("bgS"), sun = document.getElementById("sun"), vig = document.getElementById("vig");
function render(t) {
  let cur = 0; while (cur + 1 < PLANS.length && t >= PLANS[cur + 1].start) cur++;
  PLANS.forEach((P, i) => {
    const on = i === cur, lt = t - P.start, last = i === PLANS.length - 1, out = on && !last ? easeIn(win(lt, P.D - 0.32, P.D)) : 0;
    P.root.style.display = on ? "block" : "none";
    if (on) { P.root.style.transform = `translateY(${-out * 70}px)`; P.root.style.opacity = 1 - out; }
    P.A.forEach((a) => (a.prop ? a.update(lt, on, out) : on && a.update(lt)));
  });
  // weiche Übergänge zwischen den Abschnitten: Helligkeit des Studios, Größe der Bühne, Platz des Männchens
  const P = PLANS[cur], N = PLANS[cur + 1], Q = PLANS[cur - 1] || P, lt = t - P.start;
  const kin = smooth(win(lt, 0, 0.55)), zoom = lerp(Q.zoom, P.zoom, kin), hx = lerp(Q.hostX, P.hostX, kin);
  // Wechsel hell/dunkel: der neue Raum öffnet sich als Kreis hinter dem Moderator, mit gelbem Rand
  let from = P.dark, to = P.dark, k = 1;
  if (N && N.dark !== P.dark && lt > P.D - 0.4) { to = N.dark; k = win(lt, P.D - 0.4, P.D + 0.15); }
  else if (cur > 0 && Q.dark !== P.dark && lt < 0.15) { from = Q.dark; k = win(lt, -0.4, 0.15); }
  const cx = 540 + hx * PPU, headY = 1920 - zoom * (1920 - 1161), cy = headY + 60 * zoom;
  const r1 = smooth(win(k, 0, 0.88)) * 1850, r2 = smooth(win(k, 0.12, 1)) * 1850, dd = lerp(from, to, smooth(k));
  bgA.className = "bg " + (from ? "bgD" : "bgL"); bgB.className = "bg " + (to ? "bgD" : "bgL");
  bgB.style.clipPath = k >= 1 ? "none" : `circle(${r2}px at ${cx}px ${cy}px)`; bgS.style.clipPath = `circle(${k >= 1 ? 0 : r1}px at ${cx}px ${cy}px)`;
  const fg = (r2 > 1350 || k >= 1 ? to : from) ? 255 : 11; ui.style.setProperty("--fg", `rgb(${fg},${fg},${fg === 11 ? 10 : 255})`);
  hemi.intensity = lerp(1.25, 1.0, dd); key.intensity = lerp(2.3, 2.4, dd); rim.intensity = lerp(1.6, 3.0, dd); fill.intensity = lerp(0.6, 0.4, dd);
  const ei = lerp(0.6, 0.4, dd); for (const m of SHINY) m.envMapIntensity = ei; vig.style.opacity = lerp(0.3, 1, dd);
  // gelbe Scheibe hinter dem Moderator: wächst zu Beginn auf, pulsiert leicht bei jedem neuen Abschnitt
  const intro = spring(win(t, 0, 0.75)), pulse = 1 + (cur > 0 ? 0.045 * (1 - ease(win(lt, 0, 0.55))) : 0);
  sun.style.transform = `translate(${cx}px, ${cy}px) scale(${Math.max(0.001, zoom * intro * pulse)})`;
  const enter = spring(win(t, 0.08, 0.9));
  ST.position.set(hx, PIVOT_Y - (1 - enter) * 3.4, 0); ST.scale.setScalar(zoom);
  HOST.update(t);
  CONFETTI.update(t);
  // Kamera: fast frontal, mit ruhiger Seitwärtsfahrt und einem kleinen Schub nach vorn bei jedem Abschnitt
  const push = 1 - ease(win(lt, 0, 0.8)), az = Math.sin(t * 0.24) * 0.045, D = 15.8 - smooth(lt / P.D) * 0.35 + push * 0.3;
  cam.position.set(Math.sin(az) * D, 0.2, Math.cos(az) * D); cam.lookAt(0, 0, 0);
  renderer.setRenderTarget(RT); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.setScissorTest(false); renderer.clear(); { const top = Math.max(0, Math.round(CONFETTI.active(t) ? 360 : 1920 - zoom * 1180 - 40)); renderer.setScissor(0, 0, 1080, 1920 - top); } renderer.setScissorTest(true); renderer.render(POST, POST_CAM); renderer.setScissorTest(false);
  [...BAR.children].forEach((seg, i) => { const b = TM.beats[i]; seg.firstChild.style.width = clamp((t - b.start) / b.dur) * 100 + "%"; });
  const inSol = OVER.sol && t > OVER.sol.start + Math.min(3, OVER.sol.dur * 0.45) && t < OVER.sol.start + OVER.sol.dur - 0.3, inCta = OVER.cta && t > OVER.cta.start + 1.6;
  set(OVER.fine, { o: inSol || inCta ? 1 : 0 });
  const bk = OVER.cta ? ease(win(t, OVER.cta.start + 1.2, OVER.cta.start + 1.7)) : 0;
  set(OVER.brand, { x: 84, y: 1150 + (1 - bk) * 24, o: bk });
}
window.render = render;
window.collectSfx = () => SFX;
Promise.all(["840 60px Geist", "400 60px Geist", "italic 60px Serif", "600 60px Hand"].map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => { build(); render(0); window.ready = true; });
</script>

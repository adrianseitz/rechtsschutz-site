<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>whiteboard studio</title>
<style>
  /* Schriften lokal (keine Google-Fonts-Abfrage) */
  @font-face { font-family: "Kalam"; font-weight: 400; src: url(node_modules/@fontsource/kalam/files/kalam-latin-400-normal.woff2) format("woff2"); font-display: block; }
  @font-face { font-family: "Kalam"; font-weight: 700; src: url(node_modules/@fontsource/kalam/files/kalam-latin-700-normal.woff2) format("woff2"); font-display: block; }
  @font-face { font-family: "Kalam"; font-weight: 700; src: url(node_modules/@fontsource/kalam/files/kalam-latin-ext-700-normal.woff2) format("woff2"); unicode-range: U+0100-024F; font-display: block; }
  @font-face { font-family: "Geist"; font-weight: 100 900; src: url(../fonts/geist.woff2) format("woff2"); font-display: block; }
  @font-face { font-family: "SerifI"; font-style: italic; src: url(../fonts/serif-italic.woff2) format("woff2"); font-display: block; }
</style>
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { height: min(90vh, 1920px); aspect-ratio: 9 / 16; width: auto; background: #fff; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; } #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1080" height="1920"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="10" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine: config, shared kit, this engine's drawing library -->
<script src="src/config.js"></script>
<script src="src/kit.js"></script>
<script src="src/whiteboard.js"></script>
<script src="src/cast.js"></script>
<!-- model sheets (standalone loops: node render.mjs --loop=cast ...) -->
<script src="src/sheets.js"></script>
<!-- your video: one script per scene file, in order -->
<script src="src/brand.js"></script>
<script src="src/scenes/vermieter.js"></script>
<script src="src/scenes/demo.js"></script>
</body>
</html>
